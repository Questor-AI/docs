# Run the published image from GitHub Container Registry (GHCR) — no local build.
#
# Prerequisites: authenticate to ghcr.io, then pull ghcr.io/questor-ai/questor-app:latest
# From the directory with this file and .env:
#   docker compose --profile portal up -d
# One-shot CI (JSON/SARIF exports to a host folder):
#   Set HOST_SCAN_EXPORT_PATH in .env, then: ./launch.sh scan <target>
#   (<target> = folder under HOST_REPO_PATH, e.g. my-app or .)
#   (or: docker compose --profile scan run --rm -e SCAN_TARGET=... -e REPO_NAME=... scan)
#
# Environment variables: see README.md in this repo (or your administrator’s env docs).

services:
  portal:
    image: ghcr.io/questor-ai/questor-app:latest
    container_name: questorai-portal
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      # Path to the directory containing the container repositories to scan (absolute path).
      - ${HOST_REPO_PATH:?Set HOST_REPO_PATH to the host path of the repository to scan}:/repo
      # Volume for the PostgreSQL database, this will stay persistent.
      - postgres_data:/var/lib/postgresql
    environment:
      MODE: portal
      REPORT_HOST: 0.0.0.0
      POSTGRES_DATA_DIR: /var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - portal

  # One-shot CI: MODE=scan writes JSON/SARIF under /data (bind-mount HOST_SCAN_EXPORT_PATH).
  # Embedded Postgres is ephemeral (POSTGRES_DATA_DIR below, not on the export mount).
  scan:
    image: ghcr.io/questor-ai/questor-app:latest
    container_name: questorai-scan
    env_file:
      - path: .env
        required: false
    volumes:
      - ${HOST_REPO_PATH:?Set HOST_REPO_PATH to the host path of the repository to scan}:/repo
      - ${HOST_SCAN_EXPORT_PATH:?Set HOST_SCAN_EXPORT_PATH in .env to an absolute host folder for JSON/SARIF export output}:/data
    environment:
      MODE: scan
      POSTGRES_DATA_DIR: /var/lib/postgresql
    profiles:
      - scan

volumes:
  postgres_data:
