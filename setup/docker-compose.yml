# Run the published image from GitHub Container Registry (GHCR) — no local build.
#
# Prerequisites: authenticate to ghcr.io, then pull ghcr.io/questor-ai/questor-app:latest
# From the directory with this file and .env:
#   docker compose --profile portal up -d
# One-shot CI (JSON/SARIF exports to a host folder):
#   Set HOST_SCAN_EXPORT_PATH in .env, then: ./launch.sh scan <target>
#   (<target> = folder under HOST_REPO_PATH, e.g. my-app or .)
#
# Environment variables: see README.md in this repo (or your administrator’s env docs).

services:
  portal:
    image: ghcr.io/questor-ai/questor-app:latest
    container_name: questorai-portal
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORTAL_PORT:-8080}:80"
    volumes:
      # Path to the directory containing the container repositories to scan (absolute path).
      - ${HOST_REPO_PATH:?Set HOST_REPO_PATH to the host path of the repository to scan}:/repo
      # Volume for the PostgreSQL database (cluster at questor-data/ inside the mount).
      - postgres_data:/var/lib/postgresql
    environment:
      MODE: portal
      REPORT_HOST: 0.0.0.0
      POSTGRES_DATA_DIR: /var/lib/postgresql/questor-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    profiles:
      - portal

volumes:
  postgres_data:
